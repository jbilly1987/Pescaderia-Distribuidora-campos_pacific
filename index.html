const STORE={raw:null,meta:null,idb:null,ok:false,pend:{},timer:null};
function idbOpen(){return new Promise(res=>{try{if(!window.indexedDB)return res(null);let r=indexedDB.open('pescaderia',1);r.onupgradeneeded=()=>{try{r.result.createObjectStore('kv')}catch(e){}};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})}
function idbGet(k){return new Promise(res=>{try{let t=STORE.idb.transaction('kv','readonly').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>res(undefined)}catch(e){res(undefined)}})}
function idbPut(k,v){return new Promise(res=>{try{let tx=STORE.idb.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=tx.onabort=()=>res(false)}catch(e){res(false)}})}
function idbFlush(){clearTimeout(STORE.timer);STORE.timer=null;if(!STORE.idb)return;let p=STORE.pend;STORE.pend={};Object.keys(p).forEach(k=>idbPut(k,p[k]))}
// guarda en el navegador: IndexedDB siempre; localStorage solo como copia mientras quepa
function persist(lsKey,idbKey,json){let t=Date.now();if(STORE.idb){STORE.pend[idbKey]={t,j:json};if(!STORE.timer)STORE.timer=setTimeout(idbFlush,250)}
 try{localStorage.setItem(lsKey,json);localStorage.setItem(lsKey+'_t',String(t))}catch(e){try{localStorage.removeItem(lsKey);localStorage.removeItem(lsKey+'_t')}catch(_){}if(!STORE.idb)throw e}}
function lsT(k){try{return +localStorage.getItem(k+'_t')||0}catch(e){return 0}}
async function bootStore(){STORE.idb=await idbOpen();let pick=(lsKey,v)=>{let ls=null;try{ls=localStorage.getItem(lsKey)}catch(e){}if(v&&v.j&&(!ls||v.t>=lsT(lsKey)))return v.j;return ls};
 let d=STORE.idb?await idbGet('db'):null,m=STORE.idb?await idbGet('meta'):null;STORE.raw=pick('pescaderia_db_v1',d);STORE.meta=pick('pesc_sync_v1',m);STORE.ok=!!STORE.idb;
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}}
window.addEventListener('pagehide',()=>{try{idbFlush()}catch(e){}});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')try{idbFlush()}catch(e){}});
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('es-CR',{style:'currency',currency:db.settings.currency||'CRC',maximumFractionDigits:2}).format(Number(n)||0), today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}, r3=n=>Math.round(n*1000)/1000, r2=n=>Math.round(n*100)/100, uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let db={products:[],sales:[],customers:[],suppliers:[],purchases:[],expenses:[],movements:[],payments:[],users:[],closings:[],apayments:[],settings:{business:'Mi Pescadería',currency:'CRC',phone:'',address:'',email:'',priceLists:['Precio 1','Precio 2','Precio 3'],tax:0,countryCode:'506',usdRate:520,alertPhone:'',alertAuto:'1',apDays:15,creditDays:15,quoteDays:3,nextQuote:0,footer:'¡Gracias por su compra!'}};

async function load(){try{const raw=STORE.raw!==null?STORE.raw:localStorage.getItem('pescaderia_db_v1');if(raw){let old=JSON.parse(raw);db={...db,...old,settings:{...db.settings,...(old.settings||{})}};for(const k of ['products','sales','customers','suppliers','purchases','expenses','movements','payments','users','closings','apayments'])if(!Array.isArray(db[k]))db[k]=[]}}catch(e){};$('#today').textContent=new Date().toLocaleDateString('es-CR',{weekday:'long',year:'numeric',month:'long',day:'numeric'});render();}

function metric(label,val){return `<div class="card"><div class="metric-label"><span class="e">${mem(label)}</span>${label}</div><div class="metric">${val}</div></div>`}

function inventoryPage(){return `<div class="card"><h2>Existencias actuales</h2>${qIn('inv','Buscar producto, código o categoría...')}<div class="tablewrap"><table><tr><th>Producto</th><th>Existencia</th><th>Unidad</th><th>Movimiento</th></tr>${db.products.filter(p=>qm(Q.inv,p.name,p.code,p.category,p.note)).map(p=>`<tr><td>${esc(p.name)}</td><td>${stock(p)}</td><td>${esc(p.unit)}</td><td><button class="small secondary" onclick="adjustStock('${p.id}')">Ajustar</button></td></tr>`).join('')}</table></div></div><div class="card panel"><h2>Últimos movimientos</h2>${db.movements.length?`<div class="tablewrap"><table><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cantidad / monto</th><th>Referencia</th><th>Nota</th><th></th></tr>${db.movements.slice().reverse().slice(0,40).map(m=>`<tr><td>${m.date}</td><td>${esc(m.product||'Caja')}</td><td>${esc(m.type)}</td><td>${m.qty}</td><td>${esc(m.ref||'')}</td><td class="wrapn">${esc(m.note||'')}</td><td>${canDel()?`<button class="small danger" onclick="delRec('movements','${m.id}')">Eliminar</button>`:''}</td></tr>`).join('')}</table></div>`:'<div class="empty"><div class="bigE">🐚</div>Sin movimientos todavía.</div>'}</div>`}
async function adjustStock(id){let p=db.products.find(p=>p.id===id);if(!p)return;let n=await ask('Nueva existencia de '+p.name+' ('+p.unit+'). Actual: '+p.stock,{input:'Nueva existencia',type:'number',value:p.stock});if(n===null||n===''||!Number.isFinite(+n)||+n<0)return;let note=await ask('¿Por qué se ajusta? (merma, conteo, devolución...)',{input:'Nota (opcional)'});if(note===null)return;let diff=r3(+n-p.stock);p.stock=r3(+n);db.movements.push({date:today(),product:p.name,type:'Ajuste manual',qty:diff,ref:'Ajuste',note,by:(me&&me.name)||''});save();render('inventario')}
function purchasesPage(){return `<div class="card"><h2>Registrar compra / recepción</h2><form id="buyForm" class="formgrid"><div class="field"><label>Proveedor</label><select name="supplier"><option value="">Sin especificar</option>${db.suppliers.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Fecha</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>Producto</label><select name="product" required>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Cantidad recibida</label><input name="qty" type="number" min=".001" step=".001" required></div><div class="field"><label>Costo total</label><input name="cost" type="number" min="0" step=".01" required></div><div class="field"><label>Factura / referencia</label><input name="ref"></div><div class="field"><label>Forma de pago</label><select name="terms"><option value="contado">Contado (ya pagado)</option><option value="credito">Crédito (queda por pagar)</option></select></div><div class="field"><label>Abono inicial (solo crédito)</label><input name="payNow" type="number" min="0" step=".01"></div><div class="field"><label>Vence (solo crédito)</label><input name="due" type="date"></div><div class="field" style="grid-column:1/-1"><label>Nota de recepción (estado del producto, temperatura, faltantes, quién entregó...)</label><textarea name="note" rows="2"></textarea></div><button>Guardar compra y aumentar inventario</button></form></div><div class="card panel"><h2>Compras registradas</h2>${qIn('buy','Buscar factura, proveedor, producto, nota, monto o fecha...')}${db.purchases.length?`<div class="tablewrap"><table><tr><th>Fecha</th><th>Proveedor</th><th>Producto</th><th>Cantidad</th><th>Costo</th><th>Pago</th><th>Ref.</th><th>Nota</th><th>Recibió</th><th></th></tr>${db.purchases.slice().reverse().filter(x=>qm(Q.buy,x.date,x.supplier,x.productName,x.ref,x.note,x.cost,x.by,x.terms)).map(x=>`<tr><td>${x.date}</td><td>${esc(x.supplier)}</td><td>${esc(x.productName)}</td><td>${x.qty}</td><td>${money(x.cost)}</td><td>${x.terms==='credito'?(x.cost-(x.paid||0)>0.004?'<span class="pill">debe '+money(x.cost-(x.paid||0))+'</span>':'Crédito pagado'):'Contado'}</td><td>${esc(x.ref||'')}</td><td class="wrapn">${esc(x.note||'')}</td><td>${esc(x.by||'')}</td><td><button class="small secondary" onclick="showPurchase('${x.id}')">Ver</button>${canDel()?` <button class="small danger" onclick="deletePurchase('${x.id}')">Eliminar</button>`:''}</td></tr>`).join('')}</table></div>`:'<div class="empty"><div class="bigE">🐚</div>No hay compras registradas.</div>'}</div>`}

function cashPage(){let d=db.sales.filter(x=>x.date===today()&&!x.void),cash=cashDay(today()).crc,expenses=db.expenses.filter(x=>x.date===today()&&x.method==='Efectivo').reduce((a,x)=>a+x.amount,0)+apCash(today());return `<div class="grid">${metric('Efectivo cobrado hoy',money(cash))}${metric('Dólares recibidos hoy','$'+cashDay(today()).usd.toFixed(2))}${metric('Gastos en efectivo hoy',money(expenses))}${metric('Efectivo neto estimado',money(cash-expenses))}${metric('Ventas totales hoy',money(d.reduce((a,x)=>a+x.total,0)))}</div><div class="card panel"><h2>Registrar gasto o salida</h2><form id="expenseForm" class="formgrid"><div class="field"><label>Concepto</label><input name="concept" required></div><div class="field"><label>Monto</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Medio</label><select name="method"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></div><div class="field" style="grid-column:1/-1"><label>Nota (para qué fue, quién autorizó...)</label><input name="note"></div><button>Registrar gasto</button></form></div><div class="card panel"><h2>Gastos registrados</h2>${qIn('exp','Buscar concepto, nota, monto o fecha...')}${db.expenses.length?`<div class="tablewrap"><table><tr><th>Fecha</th><th>Concepto</th><th>Medio</th><th>Monto</th><th>Nota</th><th></th></tr>${db.expenses.slice().reverse().filter(x=>qm(Q.exp,x.concept,x.note,x.method,x.date,x.amount,x.by)).map(x=>`<tr><td>${x.date}</td><td>${esc(x.concept)}</td><td>${esc(x.method)}</td><td>${money(x.amount)}</td><td class="wrapn">${esc(x.note||'')}</td><td>${canDel()?`<button class="small danger" onclick="delRec('expenses','${x.id}')">Eliminar</button>`:''}</td></tr>`).join('')}</table></div>`:'<div class="empty"><div class="bigE">🐚</div>Sin gastos registrados.</div>'}</div>`}
function reportsPage(){let ok=db.sales.filter(x=>!x.void),total=ok.reduce((a,x)=>a+x.total,0),net=ok.reduce((a,x)=>a+(x.subtotal??x.total),0),cost=ok.reduce((a,s)=>a+s.items.reduce((z,i)=>z+(i.cost??db.products.find(p=>p.id===i.id)?.cost??0)*i.qty,0),0),exp=db.expenses.reduce((a,x)=>a+x.amount,0);return `<div class="grid">${metric('Ventas acumuladas',money(total))}${metric('Costo estimado vendido',money(cost))}${metric('Gastos registrados',money(exp))}${metric('Margen bruto estimado',money(net-cost))}</div><div class="card panel"><h2>Ventas registradas</h2>${salesTable(db.sales.slice().reverse())}<div class="actions"><button onclick="exportCSV()">Exportar ventas CSV</button><button class="secondary" onclick="window.print()">Imprimir reporte</button></div></div><div class="notice panel">La utilidad mostrada es estimada: no incluye gastos generales no registrados, impuestos ni otros ajustes contables.</div>`}

function restoreBackup(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{let x=JSON.parse(r.result);if(!x.products||!x.sales)throw Error();if(await ask('Esto reemplazará los datos actuales. ¿Continuar?')){db={...db,...x,settings:{...db.settings,...(x.settings||{})}};['products','sales','customers','suppliers','purchases','expenses','movements','payments','users','closings','apayments'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});save();gate();setPage('dashboard')}}catch(e){alert('El archivo no parece ser un respaldo válido.')}};r.readAsText(f)}

async function hashPw(pw,salt){try{let b=new TextEncoder().encode(salt+':'+pw),h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381,t=salt+':'+pw;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;return 'f'+h.toString(16)}}
function gate(){if(!db.users.length){me=null;$('#login').classList.remove('on');applyAccess();return}let id=null;try{id=sessionStorage.getItem('pesc_user')}catch(e){}me=db.users.find(u=>u.id===id&&u.active!==false)||null;if(me){$('#login').classList.remove('on');applyAccess();render(currentPage)}else{applyAccess();showLogin()}}
function showLogin(){let us=db.users.filter(u=>u.active!==false);$('#loginBox').innerHTML=`${logoBubble()}<h2 style="margin:0">${esc(db.settings.business)}</h2><p class="sub" style="margin:4px 0 16px">Ingrese para continuar</p><div class="field"><label>Usuario</label><select id="lgUser">${us.map(u=>`<option value="${u.id}">${esc(u.name)} (${esc(u.user)})</option>`).join('')}</select></div><div class="field" id="lgPwF"><label>Contraseña</label><input id="lgPw" type="password" autocomplete="current-password"></div><div id="lgErr" class="sub" style="color:var(--red);min-height:20px"></div><button class="tag" style="width:100%;padding:13px" onclick="doLogin()">Entrar</button><p class="sub" style="margin-top:14px">¿Olvidó la contraseña? Un administrador puede restablecerla en Configuración. Si no hay otro, <label style="text-decoration:underline;cursor:pointer">restaure un respaldo<input type="file" accept="application/json" hidden onchange="restoreBackup(this)"></label>.</p>`;$('#login').classList.add('on');$('#lgUser').onchange=lgSync;$('#lgPw').onkeydown=e=>{if(e.key==='Enter')doLogin()};lgSync()}
function lgSync(){let u=db.users.find(x=>x.id===$('#lgUser').value);$('#lgPwF').style.display=u&&u.hash?'':'none'}
async function doLogin(){let u=db.users.find(x=>x.id===$('#lgUser').value);if(!u)return;if(u.hash){let h=await hashPw($('#lgPw').value,u.salt);if(h!==u.hash){$('#lgErr').textContent='Contraseña incorrecta.';return}}try{sessionStorage.setItem('pesc_user',u.id)}catch(e){}me=u;$('#login').classList.remove('on');applyAccess();setPage('dashboard');setTimeout(lowCheck,800)}
function logout(){try{sessionStorage.removeItem('pesc_user')}catch(e){}me=null;cart=[];editing=null;gate()}
function applyAccess(){document.querySelectorAll('#nav button').forEach(b=>b.style.display=canPage(b.dataset.page)?'':'none');let c=$('#userChip');c.textContent=me?'👤 '+me.name+' · '+((ROLES[me.role]||{}).label||''):'';c.style.display=me?'':'none';$('#logoutBtn').style.display=me?'':'none';document.body.classList.toggle('ro',isRO())}
function arNotes(x){let c=db.customers.find(c=>c.id===x.id);return [c&&c.notes,...x.sales.map(v=>v.note&&v.number+': '+v.note)].filter(Boolean).join(' · ')}

function setLogo(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let w=im.naturalWidth||im.width||300,h=im.naturalHeight||im.height||300,k=Math.min(1,480/Math.max(w,h)),cw=Math.max(1,Math.round(w*k)),ch=Math.max(1,Math.round(h*k)),c=document.createElement('canvas');c.width=cw;c.height=ch;try{c.getContext('2d').drawImage(im,0,0,cw,ch);db.settings.logo=c.toDataURL('image/png');db.settings.logoW=cw;db.settings.logoH=ch;if(save()){render('config');alert('Logo guardado.')}}catch(e){alert('No se pudo procesar esa imagen.')}};im.onerror=()=>alert('No se pudo leer esa imagen. Pruebe con PNG o JPG.');im.src=r.result};r.onerror=()=>alert('No se pudo abrir el archivo.');r.readAsDataURL(f);inp.value=''}

 try{fbReady();let u=firebase.auth().currentUser;o.push('Sesión de la nube: '+(u?u.email:'NO hay sesión: toque Cerrar sesión y conecte de nuevo'))}catch(e){o.push('Sesión: error '+(e.code||e.message))}
 try{let r=await Promise.race([(async()=>{let d=firebase.firestore().doc('_diag/ping');await d.set({t:Date.now()});let g=await d.get({source:'server'});return g.exists?'OK':'sin dato'})(),new Promise((_,j)=>setTimeout(()=>j({code:'timeout'}),12000))]);o.push('Escribir y leer en Firestore: '+r)}catch(e){let k=e.code||e.message;o.push('Escribir y leer en Firestore: ERROR '+k);hint={'permission-denied':'Las reglas de Firestore no están publicadas o falta la sesión.','timeout':'No hay respuesta de Firestore: red, bloqueador de anuncios/privacidad del navegador, o la base de datos no se creó.','unavailable':'No hay respuesta de Firestore: revise internet, bloqueadores o VPN.','failed-precondition':'La base de datos Firestore no está creada o falta habilitarla.'}[k]||''}
 o.push('Estado: '+SYNC.st+' · listas '+SYNC.nready+'/'+(SYN_COLL.length+2)+(SYNC.err?' · último error: '+SYNC.err:''));
 $('#dlgBody').innerHTML='<h2>Diagnóstico de la nube</h2><pre style="white-space:pre-wrap;font:13px/1.5 inherit">'+esc(o.join('\n'))+'</pre>'+(hint?'<div class="notice">'+esc(hint)+'</div>':'')+'<div class="actions panel"><button class="tag" onclick="$(\'#dlg\').classList.remove(\'on\')">Cerrar</button></div>';$('#dlg').classList.add('on')}
async function fbRetry(){SYNC.unsubs.forEach(u=>{try{u()}catch(e){}});SYNC.unsubs=[];SYNC.nready=0;SYNC.ready={};await syncStart();render('config')}
async function fbLogout(){disableSync();try{await firebase.auth().signOut()}catch(e){}render('config')}
function fbCard(){let c=fbCfg(),mail=localStorage.getItem('pesc_fbmail')||'',n=SYN_COLL.reduce((a,k)=>a+db[k].length,0)+new Set(db.movements.map(movKey)).size,stT={off:'Desactivada',ok:'Activa y al día',sync:'Sincronizando…',err:'Sin conexión o sin sesión: los cambios se guardan aquí y se envían al volver',slow:'Conectando…',ro:'Sin permiso de escritura'}[SYNC.st];
return `<div class="card panel"><h2>☁️ Sincronización entre equipos (Firebase)</h2><p class="sub">Estado: <b>${stT}</b> · Equipo: ${esc(SYNC.dev)} · Documentos: ${n}</p>${capInfo(n)}${SYNC.on?`<div class="actions" style="margin:10px 0"><button class="tag" onclick="syncNow()">Sincronizar ahora</button><button class="secondary" onclick="fbRetry()">Reintentar conexión</button><button class="secondary" onclick="fbDiag()">Probar conexión</button><button class="danger" onclick="disableSync()">Desactivar</button><button class="secondary" onclick="fbLogout()">Cerrar sesión de la nube</button></div>`:`<div class="field"><label>Configuración de Firebase (pegue el bloque firebaseConfig)</label><textarea id="fbCfg" rows="5" placeholder='apiKey: "...", authDomain: "...", projectId: "...", appId: "..."'>${c?esc(JSON.stringify(c)):''}</textarea></div><div class="formgrid"><div class="field"><label>Correo de la cuenta del negocio</label><input id="fbMail" type="email" value="${esc(mail)}"></div><div class="field"><label>Contraseña</label><input id="fbPass" type="password" autocomplete="current-password"></div></div><button class="tag" onclick="fbConnect()">Conectar y activar</button>`}<p class="sub" style="margin-top:12px">${SYNC.on?'Si se queda en «Conectando», toque <b>Probar conexión</b>: indica qué falla.':''} En el primer equipo (el que tiene los datos) elija <i>Subir los de este equipo</i>; en los demás, <i>Usar los de la nube</i>. Pasos de creación de la cuenta: archivo FIREBASE-PASO-A-PASO.txt.</p></div>`}

// ===== ELIMINAR REGISTROS Y LIBERAR ESPACIO (también se borran de Firebase) =====
function capTxt(n){let a=Math.floor(50000/Math.max(n,1));return 'Plan gratis de Firebase: 1 GB (más de un millón de documentos) y 50.000 lecturas al día. Al abrir la app, cada equipo lee todos los documentos: hoy caben unas <b>'+(a>999?'mil o más':a)+'</b> aperturas al día entre todos los equipos.'}
function capInfo(n){let a=Math.floor(50000/Math.max(n,1));return '<p class="sub">💾 Este equipo guarda en '+(STORE.ok?'<b>IndexedDB</b> (gran capacidad)':'almacenamiento básico (~5 MB)')+'. '+capTxt(n)+'</p>'+(a<40?'<div class="notice">Quedan pocas aperturas gratis al día. Use <b>🧹 Liberar espacio</b> para archivar lo viejo, o active el plan Blaze de Firebase (paga solo lo que pase del límite; normalmente centavos).</div>':'')}
const canDel=()=>!db.users.length||(me&&me.role==='admin');
async function delRec(coll,id){if(!canDel())return alert('Solo un administrador puede eliminar registros.');let x=db[coll].find(r=>r.id===id);if(!x)return;if((coll==='payments'||coll==='apayments')&&!x.void)return alert('Primero anule este registro; después podrá eliminarlo.');if(!(await ask('¿Eliminar este registro definitivamente?\nTambién se borra de la nube y no se puede recuperar.')))return;db[coll]=db[coll].filter(r=>r.id!==id);save();render(currentPage)}
async function deleteSale(id){if(!canDel())return alert('Solo un administrador puede eliminar facturas.');let s=db.sales.find(x=>x.id===id);if(!s)return;if(db.payments.some(p=>!p.void&&!p.initial&&(p.alloc||[]).some(a=>a.saleId===id)))return alert('Esta venta tiene abonos. Anule primero los abonos en Por cobrar.');if(!(await ask((s.void?'Se eliminará la factura '+s.number+' definitivamente.':'Se anulará la factura '+s.number+' (el inventario vuelve) y se eliminará definitivamente.')+'\nTambién se borra de la nube y no se puede recuperar.')))return;if(!s.void)revertSale(id);else db.sales=db.sales.filter(x=>x.id!==id);db.payments=db.payments.filter(p=>!(p.alloc||[]).some(a=>a.saleId===id));db.movements=db.movements.filter(m=>m.ref!==s.number);save();render(currentPage)}
async function deletePurchase(id){if(!canDel())return alert('Solo un administrador puede eliminar compras.');let x=db.purchases.find(q=>q.id===id);if(!x)return;if(db.apayments.some(p=>!p.void&&(p.alloc||[]).some(a=>a.purchaseId===id)))return alert('Esta compra tiene pagos a proveedor. Anule primero esos pagos en Por pagar.');if(!(await ask('¿Eliminar la compra '+(x.ref||'sin referencia')+' definitivamente?\nTambién se borra de la nube y no se puede recuperar.')))return;let p=db.products.find(q=>q.id===x.product);if(p&&x.qty>0&&await ask('¿También descontar '+qn(x.qty)+' '+p.unit+' del inventario de '+p.name+'?',{yes:'Sí, descontar',no:'No, dejar el inventario'}))p.stock=r3(Math.max(0,p.stock-x.qty));db.purchases=db.purchases.filter(q=>q.id!==id);let k=db.movements.findIndex(m=>m.type==='Compra'&&m.ref===x.ref&&m.qty===x.qty);if(k>-1)db.movements.splice(k,1);save();render(currentPage)}
function cleanSel(){const g=(id,d)=>{let e=$('#'+id);return e?!!e.checked:d};let e=$('#clDate');return{date:(e&&e.value)||addDays(today(),-365),mov:g('cl_mov',true),void:g('cl_void',true),paid:g('cl_paid',false),buy:g('cl_buy',false),exp:g('cl_exp',false),cls:g('cl_cls',false)}}
function cleanSets(o){let d=o.date,S={sales:[],payments:[],purchases:[],apayments:[],expenses:[],closings:[],movements:[]},sd=new Set(),pd=new Set(),open=s=>s.payment==='Crédito'&&!s.void&&s.total-(s.paid||0)>0.004;
 db.sales.forEach(s=>{if(s.date<d&&((o.void&&s.void)||(o.paid&&!s.void&&!open(s)))){S.sales.push(s.id);sd.add(s.id)}});
 if(o.void||o.paid)db.payments.forEach(p=>{if(p.date>=d)return;let al=p.alloc||[],ref=al.some(a=>sd.has(a.saleId)),done=o.paid&&(p.void||al.every(a=>{let s=db.sales.find(x=>x.id===a.saleId);return !s||sd.has(a.saleId)||s.total-(s.paid||0)<=0.004}));if(ref||done)S.payments.push(p.id)});
 if(o.buy){db.purchases.forEach(x=>{if(x.date<d&&(x.terms!=='credito'||x.cost-(x.paid||0)<=0.004)){S.purchases.push(x.id);pd.add(x.id)}});db.apayments.forEach(p=>{if(p.date<d&&(p.void||(p.alloc||[]).every(a=>{let x=db.purchases.find(q=>q.id===a.purchaseId);return !x||pd.has(a.purchaseId)||x.cost-(x.paid||0)<=0.004})))S.apayments.push(p.id)})}
 if(o.exp)db.expenses.forEach(x=>{if(x.date<d)S.expenses.push(x.id)});if(o.cls)db.closings.forEach(x=>{if(x.date<d)S.closings.push(x.id)});if(o.mov)db.movements.forEach(m=>{if(m.date<d)S.movements.push(m)});
 S.docs=S.sales.length+S.payments.length+S.purchases.length+S.apayments.length+S.expenses.length+S.closings.length+new Set(S.movements.map(movKey)).size;return S}
function cleanText(S){let l=[['ventas',S.sales.length],['cobros',S.payments.length],['compras',S.purchases.length],['pagos a proveedores',S.apayments.length],['gastos',S.expenses.length],['cierres de caja',S.closings.length],['movimientos de inventario',S.movements.length]].filter(x=>x[1]).map(x=>x[1]+' '+x[0]);return l.length?'Se borrarían: '+l.join(', ')+'. Libera unos <b>'+S.docs+'</b> documentos de la nube.':'No hay registros que cumplan esas condiciones.'}
function cleanPreview(){ensureIds();$('#cleanInfo').innerHTML=cleanText(cleanSets(cleanSel()))}
function cleanCard(){if(!canDel())return '';ensureIds();let n=SYN_COLL.reduce((a,c)=>a+db[c].length,0)+new Set(db.movements.map(movKey)).size,S=cleanSets(cleanSel());return `<div class="card panel"><h2>🧹 Liberar espacio</h2><p class="sub">Documentos usados: <b>${n}</b>. ${capTxt(n)} Borrar registros viejos libera espacio en este equipo y en Firebase (en todos los equipos). Antes de borrar, exporte todo a Excel para conservar el historial.</p><div class="actions" style="margin-bottom:10px"><button class="secondary keep" onclick="exportPage('todo')">📊 Exportar todo a Excel</button></div><div class="field"><label>Borrar registros anteriores a esta fecha</label><input id="clDate" type="date" value="${addDays(today(),-365)}" onchange="cleanPreview()"></div>${[['mov','Movimientos de inventario (historial de entradas y salidas)'],['void','Ventas anuladas'],['paid','Ventas ya cobradas (contado o crédito pagado) y sus abonos'],['buy','Compras ya pagadas y sus pagos'],['exp','Gastos'],['cls','Cierres de caja']].map(([k,t])=>`<label class="chk"><input type="checkbox" id="cl_${k}" ${k==='mov'||k==='void'?'checked':''} onchange="cleanPreview()"> ${t}</label>`).join('')}<div id="cleanInfo" class="notice" style="margin:10px 0">${cleanText(S)}</div><p class="sub">Nunca se borran las ventas a crédito con saldo pendiente ni las compras con deuda.</p><button class="danger" onclick="cleanRun()">Borrar lo seleccionado</button></div>`}
async function cleanRun(){if(!canDel())return;ensureIds();let S=cleanSets(cleanSel());if(!S.docs)return alert('No hay registros que cumplan esas condiciones.');let t=await ask(cleanText(S).replace(/<[^>]+>/g,'')+'\nSe borran de este equipo y de Firebase, y no se pueden recuperar.\nEscriba BORRAR para confirmar.',{input:'Escriba BORRAR'});if(t===null||String(t).trim().toUpperCase()!=='BORRAR')return alert('No se borró nada.');
 const rm=(coll,ids)=>{let s=new Set(ids);db[coll]=db[coll].filter(x=>!s.has(x.id))};['sales','payments','purchases','apayments','expenses','closings'].forEach(k=>rm(k,S[k]));let ms=new Set(S.movements.map(m=>m.id));db.movements=db.movements.filter(m=>!ms.has(m.id));save();render('config');notify('Listo: se borraron registros. Firebase se actualiza en unos segundos.')}
