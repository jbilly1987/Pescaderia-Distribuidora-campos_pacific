.sea{position:relative;height:104px;margin-bottom:16px;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#7ccbee 0%,#cdeefa 52%,#1f6a93 53%,#17384a 100%);box-shadow:var(--shadow2,0 6px 18px #0002);user-select:none}

@keyframes seaDrift{to{background-position-x:160px}}

<script>

const STORE={raw:null,meta:null,idb:null,ok:false,pend:{},timer:null};
function idbOpen(){return new Promise(res=>{try{if(!window.indexedDB)return res(null);let r=indexedDB.open('pescaderia',1);r.onupgradeneeded=()=>{try{r.result.createObjectStore('kv')}catch(e){}};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})}
function idbGet(k){return new Promise(res=>{try{let t=STORE.idb.transaction('kv','readonly').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>res(undefined)}catch(e){res(undefined)}})}
function idbPut(k,v){return new Promise(res=>{try{let tx=STORE.idb.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=tx.onabort=()=>res(false)}catch(e){res(false)}})}
function idbFlush(){clearTimeout(STORE.timer);STORE.timer=null;if(!STORE.idb)return;let p=STORE.pend;STORE.pend={};Object.keys(p).forEach(k=>idbPut(k,p[k]))}

function persist(lsKey,idbKey,json){let t=Date.now();if(STORE.idb){STORE.pend[idbKey]={t,j:json};if(!STORE.timer)STORE.timer=setTimeout(idbFlush,250)}
 try{localStorage.setItem(lsKey,json);localStorage.setItem(lsKey+'_t',String(t))}catch(e){try{localStorage.removeItem(lsKey);localStorage.removeItem(lsKey+'_t')}catch(_){}if(!STORE.idb)throw e}}

async function bootStore(){STORE.idb=await idbOpen();let pick=(lsKey,v)=>{let ls=null;try{ls=localStorage.getItem(lsKey)}catch(e){}if(v&&v.j&&(!ls||v.t>=lsT(lsKey)))return v.j;return ls};
 let d=STORE.idb?await idbGet('db'):null,m=STORE.idb?await idbGet('meta'):null;STORE.raw=pick('pescaderia_db_v1',d);STORE.meta=pick('pesc_sync_v1',m);STORE.ok=!!STORE.idb;
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}}

const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('es-CR',{style:'currency',currency:db.settings.currency||'CRC',maximumFractionDigits:2}).format(Number(n)||0), today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}, r3=n=>Math.round(n*1000)/1000, r2=n=>Math.round(n*100)/100, uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function inventoryPage(){return `<div class="card panel"><h2>Existencias actuales</h2>${qIn('inv','Buscar producto, código o categoría...')}<div class="tablewrap"><table><tr><th>Producto</th><th>Existencia</th><th>Unidad</th><th>Movimiento</th></tr>${db.products.filter(p=>qm(Q.inv,p.name,p.code,p.category,p.note)).map(p=>`<tr><td>${esc(p.name)}</td><td>${stock(p)}</td><td>${esc(p.unit)}</td><td><button class="admonly small secondary" onclick="adjustStock('${p.id}')">Ajustar</button></td></tr>`).join('')}</table></div></div><div class="card panel"><h2>Últimos movimientos</h2>${db.movements.length?`<div class="tablewrap"><table><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cantidad / monto</th><th>Referencia</th><th>Nota</th><th></th></tr>${db.movements.filter(m=>!m.audit).slice().reverse().slice(0,40).map(m=>`<tr><td>${m.date}</td><td>${esc(m.product||'Caja')}</td><td>${esc(m.type)}</td><td>${m.qty}</td><td>${esc(m.ref||'')}</td><td class="wrapn">${esc(m.note||'')}</td><td>${canDel()?`<button class="small danger" onclick="delRec('movements','${m.id}')">Eliminar</button>`:''}</td></tr>`).join('')}</table></div>`:'<div class="empty"><div class="bigE">🐚</div>Sin movimientos todavía.</div>'}</div>`}
async function adjustStock(id){let p=db.products.find(p=>p.id===id);if(!p)return;let n=await ask('Nueva existencia de '+p.name+' ('+p.unit+'). Actual: '+p.stock,{input:'Nueva existencia',type:'number',value:p.stock});if(n===null||n===''||!Number.isFinite(+n)||+n<0)return;let note=await ask('¿Por qué se ajusta? (merma, conteo, devolución...)',{input:'Nota (opcional)'});if(note===null)return;let diff=r3(+n-p.stock);p.stock=r3(+n);db.movements.push({date:today(),product:p.name,type:'Ajuste manual',qty:diff,ref:'Ajuste',note,by:(me&&me.name)||''});save();render('inventario')}
function purchasesPage(){return `<div class="card"><h2>Registrar compra / recepción</h2><form id="buyForm" class="formgrid"><div class="field"><label>Proveedor</label><select name="supplier"><option value="">Sin especificar</option>${db.suppliers.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Fecha</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>Producto</label><select name="product" required>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Cantidad recibida</label><input name="qty" type="number" min=".001" step=".001" required></div><div class="field"><label>Costo total</label><input name="cost" type="number" min="0" step=".01" required></div><div class="field"><label>Factura / referencia</label><input name="ref"></div><div class="field"><label>Forma de pago</label><select name="terms"><option value="contado">Contado (ya pagado)</option><option value="credito">Crédito (queda por pagar)</option></select></div><div class="field"><label>Abono inicial (solo crédito)</label><input name="payNow" type="number" min="0" step=".01"></div><div class="field"><label>Vence (solo crédito)</label><input name="due" type="date"></div><div class="field" style="grid-column:1/-1"><label>Nota de recepción (estado del producto, temperatura, faltantes, quién entregó...)</label><textarea name="note" rows="2"></textarea></div><button>Guardar compra y aumentar inventario</button></form></div><div class="card panel"><h2>Compras registradas</h2>${qIn('buy','Buscar factura, proveedor, producto, nota, monto o fecha...')}${db.purchases.length?`<div class="tablewrap"><table><tr><th>Fecha</th><th>Proveedor</th><th>Producto</th><th>Cantidad</th><th>Costo</th><th>Pago</th><th>Ref.</th><th>Nota</th><th>Recibió</th><th></th></tr>${db.purchases.slice().reverse().filter(x=>qm(Q.buy,x.date,x.supplier,x.productName,x.ref,x.note,x.cost,x.by,x.terms)).map(x=>`<tr><td>${x.date}</td><td>${esc(x.supplier)}</td><td>${esc(x.productName)}</td><td>${x.qty}</td><td>${money(x.cost)}</td><td>${x.terms==='credito'?(x.cost-(x.paid||0)>0.004?'<span class="pill">debe '+money(x.cost-(x.paid||0))+'</span>':'Crédito pagado'):'Contado'+(x.method?' · '+esc(x.method)+(x.method==='Dólares'?' ($'+buyUsd(x).toFixed(2)+')':''):'')}</td><td>${esc(x.ref||'')}</td><td class="wrapn">${esc(x.note||'')}</td><td>${esc(x.by||'')}</td><td><button class="small secondary" onclick="showPurchase('${x.id}')">Ver</button>${canDel()?` <button class="small danger" onclick="deletePurchase('${x.id}')">Eliminar</button>`:''}</td></tr>`).join('')}</table></div>`:'<div class="empty"><div class="bigE">🐚</div>No hay compras registradas.</div>'}</div>`}
function customersPage(){return peoplePage('customers','Cliente')}
function suppliersPage(){return peoplePage('suppliers','Proveedor')}
function cashPage(){let d=db.sales.filter(x=>x.date===today()&&!x.void),cash=cashDay(today()).crc,expenses=db.expenses.filter(x=>x.date===today()&&x.method==='Efectivo').reduce((a,x)=>a+x.amount,0)+apCash(today())+buyCash(today());return `<div class="grid">${metric('Efectivo cobrado hoy',money(cash))}${metric('Dólares recibidos hoy','$'+cashDay(today()).usd.toFixed(2))}${metric('Gastos en efectivo hoy',money(expenses))}${metric('Efectivo neto estimado',money(cash-expenses))}${metric('Ventas totales hoy',money(d.reduce((a,x)=>a+x.total,0)))}</div><div class="card panel"><h2>Registrar gasto o salida</h2><form id="expenseForm" class="formgrid"><div class="field"><label>Concepto</label><input name="concept" required></div><div class="field"><label>Monto</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Categoría</label><select name="cat"><option>Hielo</option><option>Combustible</option><option>Planilla / salarios</option><option>Servicios (luz, agua, internet)</option><option>Alquiler</option><option>Mantenimiento</option><option>Empaques</option><option>Otros</option></select></div><div class="field"><label>Medio</label><select name="method"><option>Efectivo</option><option>SINPE Móvil</option><option>Transferencia</option><option>Cheque</option><option>Tarjeta</option><option>Dólares</option></select></div><div class="field" style="grid-column:1/-1"><label>Nota (para qué fue, quién autorizó...)</label><input name="note"></div><button>Registrar gasto</button></form></div><div class="card panel"><h2>Gastos registrados</h2>${qIn('exp','Buscar concepto, nota, monto o fecha...')}${db.expenses.length?`<div class="tablewrap"><table><tr><th>Fecha</th><th>Concepto</th><th>Medio</th><th>Monto</th><th>Nota</th><th></th></tr>${db.expenses.slice().reverse().filter(x=>qm(Q.exp,x.concept,x.note,x.method,x.date,x.amount,x.by)).map(x=>`<tr><td>${x.date}</td><td>${esc(x.concept)}${x.cat?' <span class="pill">'+esc(x.cat)+'</span>':''}</td><td>${esc(x.method)}</td><td>${money(x.amount)}</td><td class="wrapn">${esc(x.note||'')}</td><td>${canDel()?`<button class="small danger" onclick="delRec('expenses','${x.id}')">Eliminar</button>`:''}</td></tr>`).join('')}</table></div>`:'<div class="empty"><div class="bigE">🐚</div>Sin gastos registrados.</div>'}</div>`}
function reportsPage(){let ok=db.sales.filter(x=>!x.void),total=ok.reduce((a,x)=>a+x.total,0),net=ok.reduce((a,x)=>a+(x.subtotal??x.total),0),cost=ok.reduce((a,s)=>a+s.items.reduce((z,i)=>z+(i.cost??db.products.find(p=>p.id===i.id)?.cost??0)*i.qty,0),0),exp=db.expenses.filter(x=>!x.ret).reduce((a,x)=>a+x.amount,0);return `<div class="grid">${metric('Ventas acumuladas',money(total))}${metric('Costo estimado vendido',money(cost))}${metric('Gastos registrados',money(exp))}${metric('Margen bruto estimado',money(net-cost))}</div><div class="card panel"><h2>Ventas registradas</h2>${salesTable(db.sales.slice().reverse())}<div class="actions"><button onclick="exportCSV()">Exportar ventas CSV</button><button class="secondary" onclick="window.print()">Imprimir reporte</button></div></div><div class="notice panel">La utilidad mostrada es estimada: no incluye gastos generales no registrados, impuestos ni otros ajustes contables.</div>`}
function configPage(){let s=db.settings;return `<div class="card"><h2>Datos del negocio</h2><form id="configForm"><div class="formgrid"><div class="field"><label>Nombre de la pescadería</label><input name="business" value="${esc(s.business)}"></div><div class="field"><label>Moneda</label><select name="currency"><option value="CRC" ${s.currency==='CRC'?'selected':''}>Colones (CRC)</option><option value="USD" ${s.currency==='USD'?'selected':''}>Dólares (USD)</option></select></div><div class="field"><label>Teléfono</label><input name="phone" value="${esc(s.phone)}"></div><div class="field"><label>Correo</label><input name="email" value="${esc(s.email)}"></div><div class="field"><label>Dirección</label><input name="address" value="${esc(s.address)}"></div><div class="field"><label>Tipo de cambio (colones por cada dólar)</label><input name="usdRate" type="number" min="1" step=".01" value="${esc(s.usdRate??520)}"></div><div class="field"><label>WhatsApp del dueño para alertas de stock</label><input name="alertPhone" inputmode="tel" value="${esc(s.alertPhone??'')}" placeholder="8888-8888"></div><div class="field"><label>Alerta de stock al abrir el sistema</label><select name="alertAuto"><option value="1" ${s.alertAuto!=='0'?'selected':''}>Preguntar una vez al día</option><option value="0" ${s.alertAuto==='0'?'selected':''}>No preguntar</option></select></div><div class="field"><label>Días de crédito con proveedores</label><input name="apDays" type="number" min="0" value="${esc(s.apDays??15)}"></div><div class="field"><label>Código de país para WhatsApp (ej. 506)</label><input name="countryCode" value="${esc(s.countryCode??'506')}"></div><div class="field"><label>Días de crédito por defecto</label><input name="creditDays" type="number" min="0" value="${esc(s.creditDays??15)}"></div><div class="field"><label>Vigencia de la factura previa (días)</label><input name="quoteDays" type="number" min="0" value="${esc(s.quoteDays??3)}"></div><div class="field"><label>Listas de precios (separadas por coma)</label><input name="priceLists" value="${esc((s.priceLists||[]).join(', '))}"></div><div class="field"><label>IVA % (0 si no aplica)</label><input name="tax" type="number" min="0" step=".01" value="${esc(s.tax??0)}"></div><div class="field"><label>Ancho del ticket al imprimir</label><select name="ticketW"><option value="80" ${(s.ticketW||'80')=='80'?'selected':''}>80 mm (estándar)</option><option value="58" ${s.ticketW=='58'?'selected':''}>58 mm (pequeña)</option></select></div><div class="field"><label>Descuento máximo para cajeros (%) · 100 = sin límite</label><input name="maxDisc" type="number" min="0" max="100" step=".01" value="${esc(s.maxDisc??100)}"></div><div class="field"><label>Mensaje al pie del comprobante</label><input name="footer" value="${esc(s.footer??'')}"></div></div><button>Guardar configuración</button></form></div>${syncCard()}${cleanCard()}${logoCard()}${usersCard()}<div class="card panel"><h2>Respaldo y recuperación</h2><p class="sub">Guarde una copia de todos los productos, ventas, clientes y movimientos.</p><div class="actions"><button onclick="backup()">Descargar respaldo JSON</button><button class="secondary" onclick="exportPage('todo')">📊 Exportar todo a Excel</button><label class="secondary" style="padding:10px 13px;border-radius:11px;cursor:pointer">Restaurar respaldo<input type="file" accept="application/json" hidden onchange="restoreBackup(this)"></label></div></div>`}
function filterPos(){let q=$('#posSearch').value.toLowerCase(),c=$('#posCat').value;$('#posProducts').innerHTML=db.products.filter(p=>(!c||p.category===c)&&(p.name.toLowerCase().includes(q)||(p.code||'').toLowerCase().includes(q))).map(p=>`<button class="productbtn" onclick="addCart('${p.id}')"><span class="pe">${emo(p)}</span><strong>${esc(p.name)}</strong><small>${money(plist(p)[listIdx()])} / ${esc(p.unit)} · Disp. ${stock(p)}</small></button>`).join('')||'<div class="empty"><div class="bigE">🐚</div>No se encontraron productos.</div>'}
function backup(){saveBlob('respaldo-pescaderia-'+today()+'.json',new Blob([JSON.stringify(db,null,2)],{type:'application/json'}))}
function restoreBackup(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{let x=JSON.parse(r.result);if(!x.products||!x.sales)throw Error();if(await ask('Esto reemplazará los datos actuales. ¿Continuar?')){db={...db,...x,settings:{...db.settings,...(x.settings||{})}};['products','sales','customers','suppliers','purchases','expenses','movements','payments','users','closings','apayments','orders','quotes'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});save();gate();setPage('dashboard')}}catch(e){alert('El archivo no parece ser un respaldo válido.')}};r.readAsText(f)}
function exportCSV(){let rows=[['Fecha','Número','Cliente','Pago','IVA','Total','Estado'],...db.sales.map(x=>[x.date,x.number,x.customer,x.payment,x.tax||0,x.total,x.void?'Anulada':'Válida'])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');saveBlob('ventas-pescaderia-'+today()+'.csv',new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}))}
const origRender=render;render=function(p='dashboard'){if(db.users.length&&!me)return;if(!canPage(p))p='dashboard';currentPage=p;origRender(p);events(p);postRender()};

// ===== MEJORAS DE EDICIÓN, SKU, IMPRESIÓN Y SEGURIDAD DE DATOS =====
function productsPage(){return `<div class="card"><h2 id="prodFormTitle">Registrar producto</h2><form id="prodForm" class="formgrid"><input type="hidden" name="id"><div class="field"><label>Nombre</label><input name="name" required placeholder="Ej. Corvina fresca"></div><div class="field"><label>SKU / Código</label><input name="code" placeholder="Ej. PES-001"></div><div class="field"><label>Categoría</label><select name="category"><option>Pescado</option><option>Mariscos</option><option>Congelados</option><option>Otros</option></select></div><div class="field"><label>Unidad de venta</label><select name="unit"><option value="kg">Kilogramo (kg)</option><option value="unidad">Unidad</option></select></div>${db.settings.priceLists.map((n,i)=>`<div class="field"><label>${esc(n)}</label><input name="pr${i}" type="number" min="0" step=".01" ${i?'placeholder="Igual al primero"':'required'}></div>`).join('')}<div class="field" style="grid-column:1/-1"><label>Nota del producto (origen, conservación, observaciones)</label><input name="note"></div><div class="field"><label>Mayoreo desde (cantidad)</label><input name="bulkMin" type="number" min="0" step=".001" value="0"></div><div class="field"><label>Precio de mayoreo</label><input name="bulkPrice" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Costo de compra</label><input name="cost" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Existencia</label><input name="stock" type="number" min="0" step=".001" value="0"></div><div class="field"><label>Alerta de mínimo</label><input name="min" type="number" min="0" step=".001" value="0"></div><div class="actions"><button type="submit">Guardar producto</button><button type="button" class="secondary" onclick="resetProductForm()">Limpiar</button></div></form></div><div class="card panel"><div class="toolbar"><input id="prodSearch" placeholder="Buscar por nombre, SKU o categoría..."></div><div id="prodTable">${productTable()}</div></div>`}
function productTable(){if(!db.products.length)return '<div class="empty"><div class="bigE">🐚</div>Agregue el primer producto.</div>';return `<div class="tablewrap"><table><tr><th>Producto</th><th>SKU</th><th>Categoría</th><th>Unidad</th>${db.settings.priceLists.map(n=>`<th class="num">${esc(n)}</th>`).join('')}<th>Existencia</th><th>Acciones</th></tr>${db.products.map(p=>`<tr><td>${emo(p)} ${esc(p.name)}</td><td>${esc(p.code||'—')}</td><td>${esc(p.category)}</td><td>${esc(p.unit)}</td>${plist(p).map(v=>`<td class="num">${money(v)}</td>`).join('')}<td>${stock(p)}</td><td><div class="actions"><button class="admonly small secondary" onclick="editProduct('${p.id}')">Editar</button><button class="admonly danger small" onclick="removeProduct('${p.id}')">Eliminar</button></div></td></tr>`).join('')}</table></div>`}
function resetProductForm(){let f=$('#prodForm');if(f){f.reset();f.elements.id.value='';$('#prodFormTitle').textContent='Registrar producto'}}
function editProduct(id){let p=db.products.find(x=>x.id===id);if(!p)return;let f=$('#prodForm');if(!f){render('productos');f=$('#prodForm')}for(let k of ['id','name','code','category','unit','price','cost','stock','min','bulkMin','bulkPrice','note'])if(f.elements[k])f.elements[k].value=p[k]??'';plist(p).forEach((v,i)=>{if(f.elements['pr'+i])f.elements['pr'+i].value=v});$('#prodFormTitle').textContent='Editar producto';f.scrollIntoView({behavior:'smooth',block:'start'})}
function productsEvents(){const f=$('#prodForm');if(f)f.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(f)),old=db.products.find(p=>p.id===x.id);if(x.code&&db.products.some(p=>p.code&&p.code.toLowerCase()===x.code.toLowerCase()&&p.id!==x.id))return alert('Ese SKU ya está asignado a otro producto.');let obj={...old,...x,id:x.id||uid(),prices:db.settings.priceLists.map((_,i)=>+x['pr'+i]||+x.pr0||0),price:+x.pr0,bulkMin:+x.bulkMin||0,bulkPrice:+x.bulkPrice||0,cost:+x.cost,stock:+x.stock,min:+x.min};if(old)Object.assign(old,obj);else db.products.push(obj);save();render('productos')};const s=$('#prodSearch');if(s)s.oninput=()=>{$('#prodTable').innerHTML=productTableFiltered(s.value)}}
function productTableFiltered(q){let old=db.products,term=q.toLowerCase();db.products=old.filter(p=>[p.name,p.code,p.category].some(v=>String(v||'').toLowerCase().includes(term)));let h=productTable();db.products=old;return h}
function peoplePage(key,label){let editing=window.peopleEditing||{};return `<div class="card"><h2 id="peopleTitle">Registrar ${label.toLowerCase()}</h2><form id="peopleForm" class="formgrid"><input type="hidden" name="id"><div class="field"><label>Nombre</label><input name="name" required></div><div class="field"><label>Teléfono</label><input name="phone" inputmode="tel"></div><div class="field"><label>Correo</label><input name="email" type="email"></div><div class="field"><label>Notas</label><input name="notes"></div>${key==='customers'?`<div class="field"><label>Cédula / NIT</label><input name="doc"></div><div class="field"><label>Lista de precios</label><select name="list">${db.settings.priceLists.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join('')}</select></div><div class="field"><label>Límite de crédito (0 = sin límite)</label><input name="limit" type="number" min="0" step=".01" value="0"></div>`:''}<div class="actions"><button>Guardar ${label.toLowerCase()}</button><button type="button" class="secondary" onclick="resetPeopleForm()">Limpiar</button></div></form></div><div class="card panel"><h2>Listado de ${label.toLowerCase()}s</h2>${qIn(key,'Buscar por nombre, teléfono, cédula o nota...')}${db[key].length?`<div class="tablewrap"><table><tr><th>Nombre</th><th>Teléfono</th><th>Correo</th><th>Notas</th><th>Acciones</th></tr>${db[key].filter(x=>qm(Q[key],x.name,x.phone,x.email,x.notes,x.doc)).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td>${esc(x.notes)}</td><td><div class="actions"><button class="admonly small secondary" onclick="editPerson('${key}','${x.id}')">Editar</button>${key==='customers'?`<button class="small secondary" onclick="stmt('${x.id}')">Estado</button>`:''}<button class="admonly danger small" onclick="deletePerson('${key}','${x.id}')">Eliminar</button></div></td></tr>`).join('')}</table></div>`:'<div class="empty"><div class="bigE">🐚</div>Todavía no hay registros.</div>'}</div>`}
function resetPeopleForm(){let f=$('#peopleForm');if(f){f.reset();f.elements.id.value='';$('#peopleTitle').textContent='Registrar registro'}}

async function hashPw(pw,salt){try{let b=new TextEncoder().encode(salt+':'+pw),h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381,t=salt+':'+pw;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;return 'f'+h.toString(16)}}
function gate(){if(!db.users.length){me=null;$('#login').classList.remove('on');applyAccess();return}let id=null;try{id=sessionStorage.getItem('pesc_user')}catch(e){}me=db.users.find(u=>u.id===id&&u.active!==false)||null;if(me){$('#login').classList.remove('on');applyAccess();render(currentPage)}else{applyAccess();showLogin()}}
function showLogin(){let us=db.users.filter(u=>u.active!==false);$('#loginBox').innerHTML=`${logoBubble()}<h2 style="margin:0">${esc(db.settings.business)}</h2><p class="sub" style="margin:4px 0 16px">Ingrese para continuar</p><div class="field"><label>Usuario</label><select id="lgUser">${us.map(u=>`<option value="${u.id}">${esc(u.name)} (${esc(u.user)})</option>`).join('')}</select></div><div class="field" id="lgPwF"><label>Contraseña</label><input id="lgPw" type="password" autocomplete="current-password"></div><div id="lgErr" class="sub" style="color:var(--red);min-height:20px"></div><button class="tag" style="width:100%;padding:13px" onclick="doLogin()">Entrar</button><p class="sub" style="margin-top:14px">¿Olvidó la contraseña? Un administrador puede restablecerla en Configuración. Si no hay otro, <label style="text-decoration:underline;cursor:pointer">restaure un respaldo<input type="file" accept="application/json" hidden onchange="restoreBackup(this)"></label>.</p>`;$('#login').classList.add('on');$('#lgUser').onchange=lgSync;$('#lgPw').onkeydown=e=>{if(e.key==='Enter')doLogin()};lgSync()}
function lgSync(){let u=db.users.find(x=>x.id===$('#lgUser').value);$('#lgPwF').style.display=u&&u.hash?'':'none'}
async function doLogin(){let u=db.users.find(x=>x.id===$('#lgUser').value);if(!u)return;if(u.hash){let h=await hashPw($('#lgPw').value,u.salt);if(h!==u.hash){$('#lgErr').textContent='Contraseña incorrecta.';return}}try{sessionStorage.setItem('pesc_user',u.id)}catch(e){}me=u;$('#login').classList.remove('on');applyAccess();setPage('dashboard');setTimeout(lowCheck,800)}
function logout(){try{sessionStorage.removeItem('pesc_user')}catch(e){}me=null;cart=[];editing=null;gate()}
function applyAccess(){document.querySelectorAll('#nav button').forEach(b=>b.style.display=canPage(b.dataset.page)?'':'none');let c=$('#userChip');c.textContent=me?'👤 '+me.name+' · '+((ROLES[me.role]||{}).label||''):'';c.style.display=me?'':'none';$('#logoutBtn').style.display=me?'':'none';document.body.classList.toggle('ro',isRO());document.body.classList.toggle('noadm',!_isAdmin())}
function arNotes(x){let c=db.customers.find(c=>c.id===x.id);return [c&&c.notes,...x.sales.map(v=>v.note&&v.number+': '+v.note)].filter(Boolean).join(' · ')}
